<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title> </title>

<link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/boostrap.min.css">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</head>



<body>

	<div class="container">
		<details ontoggle="message()">
			<summary> Instruction </summary>
			<i> Enter the two numbers then find its answer </i>
		</details>
</div>

<br>

<form>
	<label> Enter the 1st number: </label>
	<input type="number" id="num1"placeholder="type here...">

<br>

<label> Enter the 2nd number: </label>
	<input type="number" id="num2"placeholder="type here...">

	<br><br>

	<div class="button">
		<button type="button" onmouseover="plus()"> CALCULATE </button>
		<span> <h1 id="result"> </h1> </span>
	</div>
</form>

<script>
	function message() {
   alert ("Try It");
	}

    function plus() {
    var add1 = document.getElementById("num1").value;
    var add2 = document.getElementById("num2").value;
    var sum = Number(add1) + Number (add2);
    

    document.getElementById('result').innerHTML = 'Answer is ' + sum;
}

</script>





</body>
</html>
